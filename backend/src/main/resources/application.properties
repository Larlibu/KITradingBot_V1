spring.application.name=kitradingbot-backend
server.port=8080

management.endpoints.web.exposure.include=health,info

trading.symbol=BTCUSDT
trading.default-market-limit=200
trading.sma-period=14
trading.rsi-period=14
trading.ml-confidence-threshold=0.60
trading.rsi-overbought=70
trading.rsi-oversold=30
trading.risk-per-trade=0.01
trading.initial-capital=10000
trading.ml-service-url=http://localhost:8000
trading.binance-url=https://api.binance.com/api/v3/klines
